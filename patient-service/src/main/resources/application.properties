server.port=8081
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.url=jdbc:postgresql://localhost:5000/patient_database
spring.datasource.driver-class-name=org.postgresql.Driver
springdoc.api-docs.path=/patient-service/v3/api-docs
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
#Create DB schema if not exists
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=ALWAYS
spring.jpa.defer-datasource-initialization=true
spring.sql.init.schema-locations=classpath:DDL/patient_schema.sql
spring.sql.init.data-locations=classpath:DDL/data.sql