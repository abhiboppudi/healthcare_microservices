spring.application.name=hospital-service
server.port=8084
#register-with-eureka-client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
#Database Configuration
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5000/hospital_database
#JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.show-sql=true
#Datasource configuration
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
#Messages Configuration
spring.messages.basename=error-messages/messages
spring.messages.encoding=UTF-8
#Swagger/OpenAPI Configuration
springdoc.api-docs.path=/hospital-service/v3/api-docs
#DDL&DataDump
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=ALWAYS
spring.sql.init.schema-locations=classpath:DDL/tables_schema.sql
spring.sql.init.data-locations=classpath:DDL/data_dump.sql
spring.jpa.defer-datasource-initialization=true
#Kafka_setup
spring.kafka.bootstrap-servers=localhost:9094
# Use Confluent Avro serializers
spring.kafka.producer.key-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.consumer.key-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.properties.specific.avro.reader=true
# Schema Registry URL (local container port)
spring.kafka.properties.schema.registry.url=http://localhost:8881
# Reliability
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
# Externalized topic name
spring.kafka.topic.hospital-doctor-invitation=hospital.doctor.invitation
spring.kafka.consumer.group-id=hospital-doctor-invitation-service
#logging
logging.level.io.confluent.kafka.serializers.KafkaAvroSerializerConfig=OFF