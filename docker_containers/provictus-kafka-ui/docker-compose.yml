networks:
  kafka-net:
    external: true

services:
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8882:8080"
    environment:
      # Define cluster
      KAFKA_CLUSTERS_0_NAME: "my-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"

      # Schema Registry integration
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8881"

      # Optional: enable read-only mode if you just want to browse
      # KAFKA_CLUSTERS_0_READONLY: "true"
    networks:
      - kafka-net
#    depends_on:
#      - kafka
#      - schema-registry
